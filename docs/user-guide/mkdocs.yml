site_name: AfterNight Documentation
site_description: >-
  Comprehensive user guide for AfterNight, a cross-platform astrophotography
  processing application.
site_url: https://emruiz81.github.io/afternight/

docs_dir: docs/en
site_dir: site
use_directory_urls: false

copyright: Copyright &copy; 2024-2026 Ezequiel Ruiz

theme:
  name: material
  language: en
  logo: assets/images/interface/logo.png
  favicon: assets/images/interface/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow
    - announce.dismiss
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  # Keep documentation fully offline-capable for installer bundles.
  - assets/javascripts/mermaid/mermaid.min.js
  - assets/javascripts/mermaid/mermaid-init.js
  - assets/javascripts/mathjax/tex-mml-chtml.js

extra:
  polyfills:
    - assets/javascripts/polyfills/resize-observer.js
    - assets/javascripts/iframe-worker/shim.js
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/emruiz81/afternight
  generator: false

plugins:
  - search:
      lang: en
  - tags
  - glightbox
  - offline

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          # Render with the local runtime so file:// installer copies never
          # fall back to Material's network-loaded Mermaid worker.
          class: an-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

