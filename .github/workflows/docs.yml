name: Documentation

# Builds the user guide strictly on every pull request that touches it and on every push to main that does. GitHub
# Pages carries the latest release's guide, so that Help's online fallback describes the build people have installed:
# the release workflow publishes the guide it built once the release is published, and a dispatch that asks for a
# deployment publishes the guide the latest release attached, as that release built it. A release calls this to build
# the guide its installers bundle and to hand the release workflow the archive it attaches; nothing here writes to the
# repository, and nothing here checks out or runs another ref's code.

on:
  pull_request:
    paths:
      - 'docs/user-guide/**'
      - 'docs/dev/USER_GUIDE_AUTHORING.md'
      - 'build/scripts/tools/check_user_guide.py'
      - 'build/scripts/tools/check_user_guide_test.py'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/build-windows.yml'
      - 'installer/linux_packager.sh'
      - 'installer/win_installer.iss'
      - 'src/AfterNightApp/app/AfterNightApp.*'
      - 'src/AfterNightControls/app/AfterNightAppUiBuilder.h'
      - 'src/AfterNightControls/app/DialogOrchestrationCoordinator.*'
      - 'src/AfterNightControls/app/DesktopUtils.h'
      - 'src/AfterNightControls/app/MenuActionManager.*'
      - 'src/AfterNightControls/controls/DashboardIdentityBar.*'
      - 'src/AfterNightProcesses/app/ProcessRegistryBuiltins.cpp'

  push:
    branches: [main]
    paths:
      - 'docs/user-guide/**'
      - 'build/scripts/tools/check_user_guide.py'
      - 'src/AfterNightControls/app/AfterNightAppUiBuilder.h'
      - 'src/AfterNightProcesses/app/ProcessRegistryBuiltins.cpp'
      - '.github/workflows/docs.yml'

  workflow_call:
    inputs:
      release_version:
        description: 'The version a release builds the guide for; the archive the release attaches is named after it'
        required: false
        default: ''
        type: string

  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Publish the guide the latest release attached to GitHub Pages'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Called by a release this runs in the release's context, so the group carries the calling workflow's name and a
# release never cancels, or is cancelled by, a run of the guide's own.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.deploy.outputs.deploy }}
    steps:
      # Only a dispatch of this workflow that asks deploys Pages here. A push to main builds and checks the guide
      # without publishing it, and a release publishes its own build once it is published (release.yml, deploy-guide).
      # Called by a release, the event is the release's - a tag push or a dispatch - and this workflow's dispatch
      # inputs do not exist.
      - name: Decide whether this run deploys Pages
        id: deploy
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REQUESTED: ${{ inputs.deploy_pages }}
        run: |
          deploy=false
          case "$WORKFLOW_REF" in
            */.github/workflows/docs.yml@*)
              if [ "$EVENT" = workflow_dispatch ] && [ "$REQUESTED" = true ]; then
                deploy=true
              fi ;;
          esac
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Deploy Pages: $deploy"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/user-guide/requirements.txt

      - name: Install MkDocs and plugins
        run: pip install --require-hashes -r docs/user-guide/requirements.txt

      # A release names its version, which the guide's footer and home page state; any other build says it comes from
      # the development line.
      - name: Build documentation
        env:
          AFTERNIGHT_GUIDE_VERSION: ${{ inputs.release_version }}
        run: mkdocs build -f docs/user-guide/mkdocs.yml --strict

      # The strict build holds the pages' links; the check holds each page's front matter against the guide's data and
      # the application's menus, and what the built site references, which is what the installers bundle and Help
      # opens from disk. The registry and the UI builder are read for the menus, so a change to either runs this.
      - name: Test the guide model and hooks
        run: python -m unittest discover -s docs/user-guide/hooks -p "*_test.py"

      - name: Test the guide check
        run: python build/scripts/tools/check_user_guide_test.py

      - name: Check the guide and the built site
        run: python build/scripts/tools/check_user_guide.py --site docs/user-guide/site

      - name: Upload docs site artifact
        uses: actions/upload-artifact@v6
        with:
          name: afternight-documentation-html
          path: docs/user-guide/site/
          retention-days: 30
          if-no-files-found: error

      # The release workflow's publishing job attaches this archive; this job only hands it over.
      - name: Package docs for release
        if: inputs.release_version != ''
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          mkdir -p release-assets
          cd docs/user-guide/site
          zip -r "../../../release-assets/AfterNight-Documentation-v${VERSION}.zip" .

      - name: Hand the archive to the release
        if: inputs.release_version != ''
        uses: actions/upload-artifact@v6
        with:
          name: afternight-release-documentation
          path: release-assets/
          retention-days: 7
          if-no-files-found: error

  # Publishes the guide the latest release attached, built from that release's tag by the release workflow: Pages
  # carries what the release shipped, and this run builds nothing for it.
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: needs.build-docs.outputs.deploy == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deployment at a time, and a deployment in progress is never cancelled half way.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the guide the latest release attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pattern='AfterNight-Documentation-v*.zip'
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "$pattern" --dir release-guide
          mkdir -p site
          unzip -q release-guide/AfterNight-Documentation-v*.zip -d site
          test -f site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
