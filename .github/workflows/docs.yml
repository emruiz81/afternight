name: Documentation

# Builds the user guide strictly on every pull request that touches it, and deploys it to GitHub Pages on every push
# to main that does, or on a dispatch that asks. A release calls this to build the guide its installers bundle and to
# hand the release workflow the archive it attaches; a release never deploys Pages, and nothing here writes to the
# repository.

on:
  pull_request:
    paths:
      - 'docs/user-guide/**'
      - 'docs/dev/USER_GUIDE_AUTHORING.md'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/build-windows.yml'
      - 'installer/linux_packager.sh'
      - 'installer/win_installer.iss'
      - 'src/AfterNightApp/app/AfterNightApp.*'
      - 'src/AfterNightControls/app/AfterNightAppUiBuilder.h'
      - 'src/AfterNightControls/app/DialogOrchestrationCoordinator.*'
      - 'src/AfterNightControls/app/DesktopUtils.h'
      - 'src/AfterNightControls/app/MenuActionManager.*'
      - 'src/AfterNightControls/controls/DashboardIdentityBar.*'

  push:
    branches: [main]
    paths:
      - 'docs/user-guide/**'
      - '.github/workflows/docs.yml'

  workflow_call:
    inputs:
      release_version:
        description: 'The version a release builds the guide for; the archive the release attaches is named after it'
        required: false
        default: ''
        type: string

  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Deploy to GitHub Pages'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Called by a release this runs in the release's context, so the group carries the calling workflow's name and a
# release never cancels, or is cancelled by, a run of the guide's own.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.deploy.outputs.deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      # A push to main that reaches this workflow directly, or a dispatch that asks. Called by a release, the event
      # is the release's - a tag push or a dispatch - and the workflow's own dispatch input does not exist.
      - name: Decide whether this run deploys Pages
        id: deploy
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REQUESTED: ${{ inputs.deploy_pages }}
        run: |
          deploy=false
          case "$WORKFLOW_REF" in
            */.github/workflows/docs.yml@*)
              if { [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; } || \
                 { [ "$EVENT" = workflow_dispatch ] && [ "$REQUESTED" = true ]; }; then
                deploy=true
              fi ;;
          esac
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Deploy Pages: $deploy"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/user-guide/requirements.txt

      - name: Install MkDocs and plugins
        run: pip install --require-hashes -r docs/user-guide/requirements.txt

      - name: Build documentation
        run: mkdocs build -f docs/user-guide/mkdocs.yml --strict

      - name: Upload docs site artifact
        uses: actions/upload-artifact@v6
        with:
          name: afternight-documentation-html
          path: docs/user-guide/site/
          retention-days: 30
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: steps.deploy.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/user-guide/site/

      # The release workflow's publishing job attaches this archive; this job only hands it over.
      - name: Package docs for release
        if: inputs.release_version != ''
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          mkdir -p release-assets
          cd docs/user-guide/site
          zip -r "../../../release-assets/AfterNight-Documentation-v${VERSION}.zip" .

      - name: Hand the archive to the release
        if: inputs.release_version != ''
        uses: actions/upload-artifact@v6
        with:
          name: afternight-release-documentation
          path: release-assets/
          retention-days: 7
          if-no-files-found: error

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: needs.build-docs.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, and a deployment in progress is never cancelled half way.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
