name: Cache Windows Dependencies

on:
  workflow_call:
    inputs:
      variant:
        description: 'Distinguishes two callers of this workflow inside one workflow run'
        required: false
        default: ''
        type: string
    outputs:
      vcpkg_key:
        description: 'The key the installed vcpkg ports are cached under'
        value: ${{ jobs.cache.outputs.vcpkg_key }}
      openxisf_key:
        description: 'The key the OpenXISF build is cached under'
        value: ${{ jobs.cache.outputs.openxisf_key }}
  workflow_dispatch:
    inputs:
      variant:
        description: 'Distinguishes two callers of this workflow inside one workflow run'
        required: false
        default: ''
        type: string
  # Weekly, so the caches every pull request restores are touched before the seven days without access that evict
  # them, and a cache whose key moved is rebuilt on main before a pull request needs it.
  schedule:
    - cron: '53 3 * * 1'

# The caches are written with the runner's own cache token, not the repository token, which only reads.
permissions:
  contents: read

env:
  # Keep in sync with .github/workflows/build-windows.yml
  QT_VERSION: "6.10.3"
  PYTHON_VERSION: "3.14.7"
  PYTHON_BUILD_DATE: "20260814"
  # The release-only triplet halves the dependency build. 02-install_msvc_deps.bat installs into it and the 04a and
  # 09a deploy steps copy from it.
  AFTERNIGHT_VCPKG_TRIPLET: x64-windows-release

# Keyed by the caller, the caller's variant and the ref, for the reasons recorded in cache-linux.yml.
concurrency:
  group: cache-windows-deps-${{ github.workflow }}-${{ inputs.variant }}-${{ github.ref }}
  cancel-in-progress: true

# A pull request restores what main saved, and saves a tree only when its key missed - when the pull request moved
# it, by changing a script, a pin or a version the key is made of. Its build job is on another runner and receives the
# tree through the cache alone, restoring it with fail-on-cache-miss, so without the save that pull request could never
# pass. A cache a pull request saves is scoped to it, its own later jobs and re-runs; an ordinary pull request saves
# nothing, so main's caches keep the repository's quota. The vcpkg port archives, which only a later install reads, are
# never saved from a pull request.
jobs:
  cache:
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    outputs:
      vcpkg_key: ${{ steps.vcpkg-key.outputs.key }}
      openxisf_key: ${{ steps.vcpkg-key.outputs.openxisf }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set repository vcpkg root
        run: |
          "VCPKG_ROOT=${{ github.workspace }}\\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # What is installed is decided by the runner image, the triplet, the vcpkg checkout the repository pins, the
      # install scripts and the overlay ports and triplets, so the key is made of exactly those: a change to any of
      # them installs afresh instead of restoring a tree that no longer matches the scripts. OpenXISF is built by its
      # script, which pins the release, against the ports the vcpkg key names, so its key is the script's and that one.
      - name: Compute the vcpkg cache key
        id: vcpkg-key
        shell: bash
        run: |
          key="vcpkg-${ImageOS}-${AFTERNIGHT_VCPKG_TRIPLET}-$(git rev-parse HEAD:vcpkg)-${{ hashFiles('build/scripts/msvc/02-install_msvc_deps.bat', 'build/scripts/msvc/install_raw_deps.bat', 'build/vcpkg/**') }}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "openxisf=openxisf-release-${{ hashFiles('build/scripts/msvc/_build_openxisf.bat') }}-$key" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg installed packages cache
        id: cache-vcpkg
        uses: actions/cache/restore@v5
        with:
          path: vcpkg/installed
          key: ${{ steps.vcpkg-key.outputs.key }}

      - name: Bootstrap vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics

      # A cold build of the port list may not fit in one job, which a hosted runner ends at six hours. vcpkg writes an
      # archive of every port it finishes into vcpkg-archives, and that directory goes to the Actions cache even when
      # the install fails or times out, so the next run restores the ports already built instead of rebuilding from
      # zero. An archive is named by the port's ABI hash - its sources, features, triplet, compiler and dependencies -
      # so one whose inputs changed is never restored, and the prefix key lets a run with new inputs reuse the rest.
      - name: Restore vcpkg port archives
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: vcpkg-archives
          key: vcpkg-archives-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-

      - name: Configure vcpkg binary cache
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          $archives = "${{ github.workspace }}\vcpkg-archives"
          New-Item -ItemType Directory -Force $archives | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The ports and the private RAW packages, exactly as a development machine installs them. The step stops early
      # enough to leave the job time to save the archives below.
      - name: Install vcpkg packages
        id: install-vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: cmd
        run: build\scripts\msvc\02-install_msvc_deps.bat vcpkg
        timeout-minutes: 310

      # After a complete install the archives of ports nothing installs any more are dropped, so the cache holds the
      # current port set rather than every one it has seen. An archive is named by the SHA-256 of the installed port's
      # vcpkg_abi_info.txt; if any installed port has no archive under that name the naming is not what this step
      # assumes, and it keeps everything rather than delete what it cannot match.
      - name: Drop archives of ports no longer installed
        if: steps.install-vcpkg.outcome == 'success'
        run: |
          $archives = "${{ github.workspace }}\vcpkg-archives"
          $installed = @(Get-ChildItem "${{ github.workspace }}\vcpkg\installed\*\share\*\vcpkg_abi_info.txt" |
            ForEach-Object { (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant() })
          $present = @(Get-ChildItem -Recurse -File "$archives\*.zip")
          $missing = @($installed | Where-Object { -not (Test-Path "$archives\$($_.Substring(0, 2))\$_.zip") })
          if ($installed.Count -eq 0 -or $missing.Count -gt 0) {
            "::warning::$($missing.Count) of $($installed.Count) installed ports have no archive under their ABI hash; keeping all $($present.Count) archives"
            exit 0
          }
          $stale = @($present | Where-Object { $installed -notcontains $_.BaseName })
          $stale | Remove-Item -Force
          "Kept $($installed.Count) archives, dropped $($stale.Count)"

      - name: Save vcpkg port archives
        if: always() && github.event_name != 'pull_request' && steps.cache-vcpkg.outputs.cache-hit != 'true' && steps.install-vcpkg.outcome != 'skipped'
        uses: actions/cache/save@v5
        with:
          path: vcpkg-archives
          key: vcpkg-archives-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save vcpkg installed packages cache
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: vcpkg/installed
          key: ${{ steps.vcpkg-key.outputs.key }}

      # OpenXISF from its published release, against the vcpkg ports restored or installed above.
      - name: Restore OpenXISF cache
        id: cache-openxisf
        uses: actions/cache/restore@v5
        with:
          path: openxisf/build-msvc-install
          key: ${{ steps.vcpkg-key.outputs.openxisf }}

      - name: Build OpenXISF (release-only)
        if: steps.cache-openxisf.outputs.cache-hit != 'true'
        shell: cmd
        run: build\scripts\msvc\_build_openxisf.bat release

      - name: Save OpenXISF cache
        if: steps.cache-openxisf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: openxisf/build-msvc-install
          key: ${{ steps.vcpkg-key.outputs.openxisf }}

      - name: Restore Qt cache
        id: cache-qt
        uses: actions/cache/restore@v5
        with:
          path: Qt6
          key: qt-windows-${{ env.QT_VERSION }}-msvc2022_64-vs2026-v1

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2022_64 -O Qt6

      - name: Save Qt cache
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Qt6
          key: qt-windows-${{ env.QT_VERSION }}-msvc2022_64-vs2026-v1

      - name: Restore Embedded Python cache
        id: cache-python
        uses: actions/cache/restore@v5
        with:
          path: |
            python/python/tools_msvc
            python/python314.zip
          key: python-windows-${{ env.PYTHON_VERSION }}-${{ env.PYTHON_BUILD_DATE }}-${{ hashFiles('build/scripts/python/**') }}

      - name: Install Embedded Python
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          cd build/scripts/python
          .\setup_python_msvc.bat

      - name: Save Embedded Python cache
        if: steps.cache-python.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            python/python/tools_msvc
            python/python314.zip
          key: python-windows-${{ env.PYTHON_VERSION }}-${{ env.PYTHON_BUILD_DATE }}-${{ hashFiles('build/scripts/python/**') }}

      - name: Restore KDDockWidgets cache
        id: cache-kddockwidgets
        uses: actions/cache/restore@v5
        with:
          path: kddockwidgets/build-msvc-install
          key: kddockwidgets-windows-release-${{ env.QT_VERSION }}-${{ hashFiles('kddockwidgets/CMakeLists.txt') }}-v4

      - name: Build KDDockWidgets (release-only)
        if: steps.cache-kddockwidgets.outputs.cache-hit != 'true'
        run: |
          $qtDir = "${{ github.workspace }}/Qt6/${{ env.QT_VERSION }}/msvc2022_64"
          $qtDirCmake = "$qtDir/lib/cmake/Qt6"
          $installDir = "${{ github.workspace }}/kddockwidgets/build-msvc-install"
          $buildDir = "${{ github.workspace }}/kddockwidgets/build-msvc"
          $srcDir = "${{ github.workspace }}/kddockwidgets"

          if (Test-Path $buildDir) { Remove-Item -Recurse -Force $buildDir }
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }

          cmake -B $buildDir -S $srcDir `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_PREFIX_PATH="$qtDir" `
            -DQt6_DIR="$qtDirCmake" `
            -DKDDockWidgets_QT6=ON `
            -DKDDockWidgets_QTQUICK=OFF `
            -DKDDockWidgets_FLUTTER=OFF `
            -DCMAKE_INSTALL_PREFIX="$installDir" `
            -DKDDockWidgets_FRONTENDS="qtwidgets"

          cmake --build $buildDir --config Release -- /maxcpucount
          cmake --install $buildDir --config Release

      - name: Save KDDockWidgets cache
        if: steps.cache-kddockwidgets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: kddockwidgets/build-msvc-install
          key: kddockwidgets-windows-release-${{ env.QT_VERSION }}-${{ hashFiles('kddockwidgets/CMakeLists.txt') }}-v4
