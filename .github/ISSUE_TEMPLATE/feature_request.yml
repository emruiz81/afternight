name: Feature request
description: Something AfterNight should do that it does not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search the open issues first; if one asks for the same thing, add what you know to it.
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and what stops you doing it with AfterNight today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How you would like it to work - the process, the window, the setting or the file it reads or writes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
      description: The workaround you use, if any.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        A publication, a specification or a file format the feature rests on. If the feature would carry code from another project, name the project, the file and its licence: derived code has to be licence-compatible and credited.
    validations:
      required: false
